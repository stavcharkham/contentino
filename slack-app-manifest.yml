display_information:
  name: Contentino
  description: Generate, score, and review Lemonade content
  background_color: "#171A1F"
features:
  bot_user:
    display_name: Contentino
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
      - reactions:write
settings:
  event_subscriptions:
    request_url: https://YOUR-VERCEL-DOMAIN/api/slack?x-vercel-protection-bypass=YOUR-VERCEL-AUTOMATION-BYPASS-SECRET
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
